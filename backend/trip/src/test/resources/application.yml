# src/test/resources/application.yml
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

# Jwt 설정 (JwtTokenProvider에서 사용)
jwt:
  secret: YourBase64EncodedSecretKeyMustBeLongEnough1234567890
  access-token-expiration-msec: 3600000
  refresh-token-expiration-msec: 1209600000
