spring.application.name=trip

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Settings
# 임의의 Secret Key (실제 운영 시에는 환경변수 등으로 관리 권장)
jwt.secret=dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIGp3dCB0b2tlbiBnZW5lcmF0aW9uIGluIHRoZSB0cmlwIHByb2plY3Q=
# Access Token 만료 시간: 1시간 (3600000ms)
jwt.access-token-expiration-msec=3600000
# Refresh Token 만료 시간: 7일 (604800000ms)
jwt.refresh-token-expiration-msec=604800000
